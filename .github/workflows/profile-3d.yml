name: Generate 3D contribution profile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-3d.yml"
  # The generated SVG includes the current date range, so a daily run creates
  # a commit even when the contribution data has not meaningfully changed.
  # Update every three days to keep the profile current without daily
  # contribution-feed noise. (Cron day-of-month intervals reset at month end.)
  schedule:
    - cron: "20 18 */3 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: NHK-DOT
      - name: Commit generated 3D contribution graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update 3D contribution graph (every 3 days)"
          file_pattern: profile-3d-contrib/*.svg
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
